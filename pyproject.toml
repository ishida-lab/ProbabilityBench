[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "probabilitybench"
version = "0.1.0"
description = "Synthetic prediction datasets with exact ground-truth probabilities."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "The ProbabilityBench Authors"}]
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
plot = ["matplotlib>=3.8"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["probabilitybench*"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
